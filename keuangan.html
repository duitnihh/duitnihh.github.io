<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ee4d2d">
<title>Catatan Driver ShopeeFood</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f23;--mut:#6b7280;--in:#0f766e;--out:#dc2626;--ac:#ee4d2d;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c333b;--in:#2dd4bf;--out:#f87171;--ac:#ff7a5c}}
*{box-sizing:border-box}
body{margin:auto;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:560px}
h1{font-size:1.2rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sum div{font-size:.8rem;color:var(--mut)}
.sum b{display:block;font-size:1.05rem;color:var(--tx)}
.bersih{grid-column:1/3;text-align:center;padding-top:8px;border-top:1px solid var(--bd)}
.bersih b{font-size:1.5rem}
.hari{margin-top:10px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--ac) 12%,transparent);font-size:.9rem}
.in{color:var(--in)!important}.out{color:var(--out)!important}
form{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row.solo{grid-template-columns:1fr}
input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button.p{background:var(--ac);color:#fff;border:0;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.seg input{display:none}
.seg label:has(input:checked){font-weight:700;border-color:var(--in);background:color-mix(in srgb,var(--in) 15%,transparent)}
.seg label.k:has(input:checked){border-color:var(--out);background:color-mix(in srgb,var(--out) 15%,transparent)}
.dayhead{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);padding:10px 0 4px;border-bottom:1px solid var(--bd);font-weight:600}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.item small{color:var(--mut);display:block}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.del{background:none;border:0;color:var(--mut);width:auto;padding:2px 0;font-size:.8rem}
.empty{color:var(--mut);text-align:center;padding:16px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{font-size:.85rem}
.tools .danger{grid-column:1/3;color:var(--out);border-color:var(--out);background:transparent}
</style></head><body>
<h1>Catatan Driver ShopeeFood</h1>

<div class="card">
  <input type="month" id="bulan">
  <div class="sum">
    <div>Pemasukan<b class="in" id="sIn">Rp 0</b></div>
    <div>Pengeluaran<b class="out" id="sOut">Rp 0</b></div>
    <div>Total order<b id="sOrd">0</b></div>
    <div>Rata-rata per order<b id="sAvg">Rp 0</b></div>
    <div class="bersih">Bersih bulan ini<b id="sBersih">Rp 0</b></div>
  </div>
  <div class="hari" id="hari"></div>
</div>

<div class="card">
  <form id="f">
    <div class="seg">
      <label><input type="radio" name="jenis" value="masuk" checked>Pemasukan</label>
      <label class="k"><input type="radio" name="jenis" value="keluar">Pengeluaran</label>
    </div>
    <input id="jumlah" type="number" inputmode="numeric" min="1" placeholder="Jumlah (Rp)" required>
    <div class="row" id="row">
      <input id="kategori" list="kat" placeholder="Kategori" required>
      <input id="tanggal" type="date" required>
    </div>
    <datalist id="kat"></datalist>
    <input id="order" type="number" inputmode="numeric" min="0" placeholder="Jumlah order hari ini (opsional)">
    <input id="catatan" placeholder="Catatan (opsional)">
    <button class="p" type="submit">Simpan</button>
  </form>
</div>

<div class="card" id="list"></div>

<div class="card tools">
  <button id="exp">Cadangkan (JSON)</button>
  <button id="imp">Pulihkan (JSON)</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <button id="reset" class="danger">Reset semua data</button>
</div>

<script>
const KEY="keuangan_v1";
const KAT={
  masuk:["Pemasukan"],
  keluar:["Bensin","Makan","Jajan","Minum","Ganti oli","Servis motor"]
};
const $=s=>document.querySelector(s);
const rp=n=>"Rp "+Number(n).toLocaleString("id-ID");
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const jenis=()=>document.querySelector("input[name=jenis]:checked").value;

let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Gagal menyimpan ke penyimpanan browser")}};

function setKategori(){
  const j=jenis();
  $("#kat").replaceChildren(...KAT[j].map(k=>{const o=document.createElement("option");o.value=k;return o}));
  $("#kategori").value=KAT[j][0];
  $("#kategori").style.display=j==="masuk"?"none":"";
  $("#row").classList.toggle("solo",j==="masuk");
  $("#order").style.display=j==="masuk"?"":"none";
}

function sumOf(rows){
  let i=0,o=0,ord=0,inOrd=0;
  rows.forEach(t=>{
    if(t.jenis==="masuk"){i+=t.jumlah;if(t.order>0){ord+=t.order;inOrd+=t.jumlah}}
    else o+=t.jumlah;
  });
  return {i,o,ord,inOrd};
}

function render(){
  const m=$("#bulan").value;
  const rows=data.filter(t=>!m||t.tanggal.startsWith(m))
    .sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.dibuat-a.dibuat);
  const s=sumOf(rows);
  $("#sIn").textContent=rp(s.i);
  $("#sOut").textContent=rp(s.o);
  $("#sOrd").textContent=s.ord;
  $("#sAvg").textContent=rp(s.ord?Math.round(s.inOrd/s.ord):0);
  const b=$("#sBersih");b.textContent=rp(s.i-s.o);b.className=s.i-s.o<0?"out":"in";

  const h=sumOf(data.filter(t=>t.tanggal===today()));
  $("#hari").textContent="Hari ini: pemasukan "+rp(h.i)+", "+h.ord+" order, bersih "+rp(h.i-h.o);

  const box=$("#list");box.replaceChildren();
  if(!rows.length){const e=document.createElement("div");e.className="empty";e.textContent="Belum ada transaksi.";box.append(e);return}

  const groups={};
  rows.forEach(t=>{(groups[t.tanggal]=groups[t.tanggal]||[]).push(t)});
  Object.keys(groups).sort().reverse().forEach(day=>{
    const g=sumOf(groups[day]);
    const hd=document.createElement("div");hd.className="dayhead";
    const l=document.createElement("span");
    l.textContent=new Date(day+"T00:00:00").toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"});
    const r=document.createElement("span");
    r.textContent="Bersih "+rp(g.i-g.o);
    hd.append(l,r);box.append(hd);

    groups[day].forEach(t=>{
      const it=document.createElement("div");it.className="item";
      const left=document.createElement("div");
      const k=document.createElement("b");k.textContent=t.kategori;
      const sm=document.createElement("small");
      const info=[];
      if(t.order>0)info.push(t.order+" order");
      if(t.catatan)info.push(t.catatan);
      sm.textContent=info.join(" · ");
      left.append(k);if(info.length)left.append(sm);
      const right=document.createElement("div");right.className="amt";
      const a=document.createElement("span");a.className=t.jenis==="masuk"?"in":"out";
      a.textContent=(t.jenis==="masuk"?"+":"-")+rp(t.jumlah);
      const d=document.createElement("button");d.className="del";d.textContent="hapus";
      d.onclick=()=>{if(confirm("Hapus transaksi ini?")){data=data.filter(x=>x.id!==t.id);save();render()}};
      right.append(a,document.createElement("br"),d);
      it.append(left,right);box.append(it);
    });
  });
}

document.querySelectorAll("input[name=jenis]").forEach(r=>r.addEventListener("change",setKategori));

$("#f").addEventListener("submit",e=>{
  e.preventDefault();
  const j=jenis();
  const tx={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    jenis:j,
    jumlah:parseInt($("#jumlah").value,10),
    kategori:$("#kategori").value.trim(),
    tanggal:$("#tanggal").value,
    catatan:$("#catatan").value.trim(),
    dibuat:Date.now()
  };
  const ord=parseInt($("#order").value,10);
  if(j==="masuk"&&ord>0)tx.order=ord;
  data.push(tx);
  save();
  $("#jumlah").value="";$("#catatan").value="";$("#order").value="";
  render();
});

$("#exp").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
  a.download="keuangan-"+today()+".json";a.click();
};
$("#reset").onclick=()=>{
  if(!data.length){alert("Tidak ada data untuk direset.");return}
  if(!confirm("Hapus SEMUA "+data.length+" transaksi? Tindakan ini tidak bisa dibatalkan.\n\nSaran: tekan Batal dulu dan cadangkan data lewat tombol Cadangkan.")) return;
  if(prompt('Ketik RESET untuk melanjutkan:')!=="RESET"){alert("Reset dibatalkan.");return}
  data=[];
  try{localStorage.removeItem(KEY)}catch(e){}
  render();
  alert("Semua data telah dihapus.");
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  try{
    const arr=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(arr))throw 0;
    const ada=new Set(data.map(t=>t.id));
    arr.filter(t=>t&&t.id&&!ada.has(t.id)&&t.jumlah>0&&t.tanggal).forEach(t=>data.push(t));
    save();render();alert("Pemulihan selesai");
  }catch(_){alert("File tidak valid")}
  e.target.value="";
};

$("#bulan").value=today().slice(0,7);
$("#tanggal").value=today();
$("#bulan").addEventListener("change",render);
setKategori();
render();
</script></body></html>
